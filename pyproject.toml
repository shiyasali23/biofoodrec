[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biofoodrec"
version = "0.3.0"
description = "Food recommendations from blood test results, with bias and weight tables you can tune per person"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
keywords = ["nutrition", "diet", "blood test", "biomarkers", "food recommendation", "explainable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=7"]
notebook = ["jupyterlab>=4", "ipywidgets>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biofoodrec = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
